  <ellipse cx="30" cy="30" rx="10" ry="25" fill="none" stroke="#4C84BC" stroke-width="1.5"/>
  <line x1="5" y1="30" x2="55" y2="30" stroke="#4C84BC" stroke-width="1.5"/>
  
  <!-- Text: Gest -->
  <text x="70" y="42" font-family="Titillium Web, Arial, sans-serif" font-size="32" font-weight="400" fill="#808080">Gest</text>
  
  <!-- Globe small (as O) -->
  <circle cx="152" cy="32" r="12" fill="none" stroke="#4C84BC" stroke-width="1.5"/>
